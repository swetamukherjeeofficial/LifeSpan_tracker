<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Timer</title>
    <link rel="stylesheet" href="Style.Css" />
    <script src="https://kit.fontawesome.com/c6213c5ec5.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="background">
      <div id="initialText" class="container">
        <h1>Kindly Enter Your Date Of Birth</h1>
        </div>
      <div id="afterDOBBtnTxt" class="container hide">
        <div class="center">          
        <h1>How Much Life Journey Covered Till Now</h1>
        <div class="time-container">
        <h2>
            <div id="Year">0</div>
            Years
          </h2> 
          <h2>
            <div id="Month">0</div>
            Months
          </h2> 
          <h2>
            <div id="Day">0</div>
            Days
          </h2> 
          <h2>
            <div id="Hour">0</div>
            Hours
          </h2> 
          <h2>
            <div id="Minute">0</div>
            Minutes
          </h2> 
          <h2>
            <div id="Second">0</div>
            Seconds
          </h2>  
      </div>
      </div>
      </div>

      <div class="settings">
  <div id="settingIcon">
    <i class="fa-solid fa-gear"></i>
  </div>
  <div id="settingContent" class="settings-content hide">
    <input type="date" id="dobInput" />
    <button id="dobButton">Add DOB</button>
  </div>
</div>
</div>
<script src="./Index.Js"></script>
</body>
</html>
